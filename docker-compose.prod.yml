version: '3.8'

services:
  backend:
    build:
      context: ./backend
      target: production
    container_name: ssc-backend-prod
    environment:
      - NODE_ENV=production
    env_file:
      - .env.production
    restart: always
    networks:
      - ssc-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  frontend:
    build:
      context: ./frontend
      target: production
    container_name: ssc-frontend-prod
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    env_file:
      - .env.production
    depends_on:
      - backend
    restart: always
    networks:
      - ssc-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

networks:
  ssc-network:
    driver: bridge
