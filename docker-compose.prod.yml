version: '3.8'

services:
  app:
    build:
      context: .
      target: production
    container_name: ssc-nextjs-prod
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data  # Persist database
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:./data/app.db
      - ENABLE_ENHANCED_OPTIMIZATION=true
      - ENABLE_PRESENT_VALUE=true
      - ENABLE_PROJECTIONS=true
      - DEFAULT_DISCOUNT_RATE=0.03
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
