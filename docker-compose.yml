version: '3.8'

services:
  backend:
    build:
      context: ./backend
      target: development
    container_name: ssc-backend-dev
    ports:
      - "3002:3002"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    env_file:
      - .env.development
    restart: unless-stopped
    networks:
      - ssc-network

  frontend:
    build:
      context: ./frontend
      target: build
    container_name: ssc-frontend-dev
    ports:
      - "5174:5174"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    env_file:
      - .env.development
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - ssc-network

networks:
  ssc-network:
    driver: bridge
